name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Background plugin
        continue-on-error: true
        run: |
          npm install --legacy-peer-deps
          for v in $(npm view @anuradev/capacitor-background-mode versions --json | node -pe "JSON.parse(require('fs').readFileSync(0)).reverse().join(' ')"); do
            if npm view @anuradev/capacitor-background-mode@$v peerDependencies --json | grep -Eq '"@capacitor/core": "[^"]*6\.'; then
              npm install @anuradev/capacitor-background-mode@$v --legacy-peer-deps && break
            fi
          done
      - name: Build
        run: |
          mkdir www
          cp index.html firebase-config.js icon-192.png www/
          npm install --legacy-peer-deps
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do cp icon-192.png $d/ic_launcher.png; cp icon-192.png $d/ic_launcher_round.png; done
          npx cap sync android
          cd android
          chmod +x gradlew
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/debug.keystore" ~/.android/debug.keystore
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
